<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nira Command Builder | سازنده دستورات نیرا</title>
<style>
:root{
  --bg:#0f172a;--panel:#1e293b;--card:#ffffff;
  --border:#e2e8f0;--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --accent:#0d9488;--accent-d:#0f766e;--accent-l:#ccfbf1;
  --blue:#2563eb;--blue-l:#dbeafe;--orange:#d97706;--orange-l:#fef3c7;
  --red:#dc2626;--red-l:#fee2e2;--green:#059669;--green-l:#d1fae5;
  --purple:#7c3aed;--purple-l:#ede9fe;--cyan:#06b6d4;
  --code:#0f172a;--code-t:#5eead4;--radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:var(--text);line-height:1.7;font-size:14px}
::selection{background:var(--accent);color:#fff}
.header{background:linear-gradient(120deg,#0f172a 0%,#134e4a 55%,#0d9488 100%);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(13,148,136,.35)}
.header-inner{max-width:1440px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:44px;height:44px;background:rgba(255,255,255,.14);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.brand h1{font-size:17px;font-weight:700}.brand p{font-size:11px;opacity:.75;margin-top:2px}
.tabs{display:flex;gap:8px;background:rgba(255,255,255,.1);padding:5px;border-radius:12px}
.tab-btn{border:none;background:transparent;color:#cbd5e1;padding:9px 18px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:.2s;display:flex;align-items:center;gap:7px}
.tab-btn.active{background:#fff;color:var(--accent-d);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tab-btn:hover:not(.active){color:#fff}
.container{max-width:1440px;margin:0 auto;padding:20px;min-height:calc(100vh - 76px)}
.view{display:none;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.view.active{display:grid}
@media(max-width:960px){.view.active{grid-template-columns:1fr}}
.sidebar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:sticky;top:86px;max-height:calc(100vh - 106px);display:flex;flex-direction:column}
@media(max-width:960px){.sidebar{position:static;max-height:none}}
.side-search{margin:12px;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:12px;width:calc(100% - 24px)}
.side-search:focus{outline:none;border-color:var(--accent)}
.side-scroll{overflow-y:auto;padding:0 8px 12px}
.side-cat-name{padding:12px 12px 5px;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.3px}
.side-item{width:100%;text-align:right;border:none;background:none;cursor:pointer;font-family:inherit;padding:8px 10px;border-radius:9px;display:flex;align-items:center;gap:10px;transition:.15s;border-right:3px solid transparent;margin-bottom:2px}
.side-item:hover{background:#f1f5f9}
.side-item.active{background:var(--accent-l);border-right-color:var(--accent)}
.si-cmd{font-family:'Consolas',monospace;font-size:11px;font-weight:700;color:var(--accent-d);background:var(--accent-l);padding:2px 8px;border-radius:6px;direction:ltr;min-width:44px;text-align:center;flex-shrink:0}
.side-item.active .si-cmd{background:var(--accent);color:#fff}
.si-title{font-size:12px;color:var(--text-2);font-weight:600}
.side-item.active .si-title{color:var(--accent-d)}
.side-item.wiz .si-cmd{background:var(--purple-l);color:var(--purple)}
.side-item.wiz.active{background:var(--purple-l);border-right-color:var(--purple)}
.side-item.wiz.active .si-cmd{background:var(--purple);color:#fff}
.side-item.guide .si-cmd{background:#cffafe;color:#0e7490}
.side-item.guide.active{background:#cffafe;border-right-color:var(--cyan)}
.side-item.guide.active .si-cmd{background:var(--cyan);color:#fff}
.content{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;min-width:0}
.spec-head{padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:20px}
.spec-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cmd-badge{font-family:'Consolas',monospace;font-size:13px;background:var(--code);color:var(--code-t);padding:3px 12px;border-radius:8px;direction:ltr}
.spec-desc{font-size:13px;color:var(--text-2);margin-top:8px}
.pattern{margin-top:10px;font-size:12px;color:var(--text-2);background:#f8fafc;border:1px dashed var(--border);padding:8px 12px;border-radius:8px}
.pattern code{font-family:'Consolas',monospace;direction:ltr;display:inline-block;color:var(--accent-d);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--text-2)}
.req{color:var(--red)}
.inp{padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;background:#fff;color:var(--text);width:100%;transition:.2s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.inp.ltr{direction:ltr;text-align:left;font-family:'Consolas',monospace}
.hint{font-size:11px;color:var(--text-3);line-height:1.6}
.output-wrap{margin-top:24px;background:var(--code);border-radius:14px;padding:20px;position:relative;overflow:hidden}
.output-wrap::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,#0d9488,#5eead4)}
.output-label{color:#94a3b8;font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.output-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px;min-height:56px;display:flex;align-items:center}
.cmd-text{font-family:'Consolas','Courier New',monospace;font-size:16px;color:var(--code-t);direction:ltr;text-align:left;word-break:break-all;width:100%;line-height:1.8;font-weight:600}
.cmd-multi{white-space:pre-wrap;font-size:13px}
.output-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn-copy{background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:.2s;display:flex;align-items:center;gap:7px}
.btn-copy:hover{background:var(--accent-d)}
.btn-ghost{background:transparent;color:#94a3b8;border:1.5px solid rgba(255,255,255,.2);padding:10px 18px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;transition:.2s}
.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.examples{margin-top:22px}.ex-label{font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:10px}
.ex-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:'Consolas',monospace;font-size:12px;direction:ltr;background:#f1f5f9;border:1.5px solid var(--border);color:var(--text);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.2s}
.chip:hover{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d)}
.notes{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.note{border-radius:10px;padding:12px 15px;font-size:12px;line-height:1.8}
.note.info{background:var(--blue-l);border-right:3px solid var(--blue);color:#1e3a8a}
.note.warn{background:var(--orange-l);border-right:3px solid var(--orange);color:#78350f}
.note.danger{background:var(--red-l);border-right:3px solid var(--red);color:#7f1d1d}
.note.success{background:var(--green-l);border-right:3px solid var(--green);color:#064e3b}
.wiz-header{background:linear-gradient(120deg,#4c1d95,#7c3aed);color:#fff;border-radius:14px;padding:20px;margin-bottom:20px}
.wiz-header.guide{background:linear-gradient(120deg,#0e7490,#06b6d4)}
.wiz-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.wiz-desc{font-size:13px;opacity:.9;margin-top:6px;line-height:1.8}
.wiz-modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mode-chip{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:12px;transition:.2s}
.mode-chip:hover{background:rgba(255,255,255,.15)}
.mode-chip.active{background:#fff;color:var(--purple);font-weight:700;border-color:#fff}
.wiz-progress{display:flex;align-items:center;gap:12px;margin-top:16px}
.wiz-bar{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.wiz-fill{height:100%;background:#5eead4;border-radius:6px;transition:width .3s}
.wiz-step-label{font-size:12px;font-weight:700;white-space:nowrap}
.wiz-steps-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.step-dot{border:1.5px solid var(--border);background:#fff;color:var(--text-2);min-width:34px;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;transition:.2s}
.step-dot:hover{border-color:var(--purple);color:var(--purple)}
.step-dot.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.step-dot.done{background:var(--green-l);color:var(--green);border-color:var(--green)}
.wiz-step-card{display:flex;gap:16px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px}
.wiz-step-num{width:44px;height:44px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.wiz-step-body{flex:1;min-width:0}
.wiz-step-title{font-size:16px;font-weight:700;margin-bottom:4px}
.wiz-step-desc{font-size:13px;color:var(--text-2);margin-bottom:16px}
.wiz-spec-area{margin-top:4px}
.wiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.btn-nav{padding:11px 26px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:.2s;border:none;display:flex;align-items:center;gap:8px}
.btn-prev{background:#fff;border:1.5px solid var(--border);color:var(--text-2)}
.btn-prev:hover{border-color:var(--purple);color:var(--purple)}
.btn-next{background:var(--purple);color:#fff}
.btn-next:hover{background:#6d28d9}
.btn-next:disabled{background:#cbd5e1;cursor:not-allowed}
.pax-card{border:1.5px dashed var(--border);border-radius:12px;padding:16px;margin-top:14px}
.pax-card-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:12px}
/* ===== GUIDES ===== */
.guide-sample{background:var(--code);border-radius:14px;padding:20px;margin:18px 0;overflow-x:auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.g-line{font-family:'Consolas',monospace;font-size:15px;color:#e2e8f0;direction:ltr;text-align:left;white-space:pre;padding:6px 0;line-height:1.9}
.g-tok{color:#5eead4;cursor:pointer;padding:2px 5px;border-radius:6px;transition:.15s;font-weight:700}
.g-tok:hover{background:rgba(94,234,212,.18)}
.g-tok.sel{background:#0d9488;color:#fff;box-shadow:0 0 0 2px rgba(13,148,136,.4)}
.g-plain{color:#94a3b8}
.g-hint{font-size:12px;color:var(--text-3);text-align:center;margin:10px 0 14px}
.g-detail{background:#ecfeff;border:1.5px solid #a5f3fc;border-radius:12px;padding:18px;min-height:80px}
.g-detail-empty{color:var(--text-3);font-size:13px;text-align:center;padding:14px}
.g-detail-title{font-size:15px;font-weight:700;color:#0e7490;margin-bottom:6px}
.g-detail-desc{font-size:13px;color:var(--text-2);line-height:1.9}
.g-gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:18px}
.g-gloss-item{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:.15s}
.g-gloss-item:hover{border-color:var(--cyan)}
.g-gloss-item.active{border-color:#0e7490;background:#ecfeff}
.g-gloss-label{font-size:13px;font-weight:700;color:#0e7490}
.g-gloss-desc{font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.7}
.guide-table-wrap{margin-top:18px;background:#fff;border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
.g-table-title{padding:14px 18px;font-size:14px;background:#f1f5f9;border-bottom:1.5px solid var(--border);font-weight:700}
.g-table{width:100%;border-collapse:collapse;font-size:13px}
.g-table th{background:#f8fafc;padding:10px 14px;text-align:right;font-size:12px;color:var(--text-2);border-bottom:1.5px solid var(--border)}
.g-table td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-2)}
.g-table tr:last-child td{border-bottom:none}
.g-table td.mono{font-family:'Consolas',monospace;direction:ltr;text-align:left;color:var(--accent-d);font-weight:700;white-space:nowrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--code);color:#5eead4;padding:12px 26px;border-radius:12px;font-size:13px;font-family:'Consolas',monospace;direction:ltr;transition:transform .3s;z-index:999;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
@media(max-width:600px){.fields{grid-template-columns:1fr}.content{padding:18px}.wiz-step-card{flex-direction:column}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">✈️</div>
      <div><h1>Nira Command Builder</h1><p>سازنده دستورات ترمینال و وب‌سرویس سامانه رزرواسیون نیرا</p></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabTerm" onclick="switchView('term')">⌨️ ترمینال نیرا</button>
      <button class="tab-btn" id="tabApi" onclick="switchView('api')">📡 وب‌سرویس (API)</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="view active" id="viewTerm">
    <aside class="sidebar">
      <input class="side-search" id="searchTerm" placeholder="🔍 جستجو...">
      <div class="side-scroll" id="sideTerm"></div>
    </aside>
    <main class="content" id="areaTerm"></main>
  </div>
  <div class="view" id="viewApi">
    <aside class="sidebar">
      <input class="side-search" id="searchApi" placeholder="🔍 جستجوی متد...">
      <div class="side-scroll" id="sideApi"></div>
    </aside>
    <main class="content" id="areaApi"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function P(v,d){return (v&&String(v).trim())?String(v).trim():d;}
var GREG_MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function gregFromDateInput(v){if(!v)return'';var p=v.split('-');var d=parseInt(p[2],10);var m=GREG_MONTHS[parseInt(p[1],10)-1];return (d<10?'0':'')+d+m;}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){fallbackCopy(t);});}else{fallbackCopy(t);}}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function showToast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1800);}
function outputBlock(outId,copyId,multi){
  var h='<div class="output-wrap" style="margin-top:16px"><div class="output-label">📟 دستور تولید شده:</div>';
  if(multi){h+='<div class="output-box"><pre class="cmd-text cmd-multi" id="'+outId+'"></pre></div>';}
  else{h+='<div class="output-box"><span class="cmd-text" id="'+outId+'"></span></div>';}
  h+='<div class="output-actions"><button class="btn-copy" id="'+copyId+'">📋 کپی</button></div></div>';return h;
}
function wireCopy(copyId,outId){
  document.getElementById(copyId).addEventListener('click',function(){copyText(document.getElementById(outId).textContent);showToast('کپی شد');var s=this;s.textContent='✅ کپی شد';setTimeout(function(){s.textContent='📋 کپی';},1500);});
}

/* ================= READ-OUTPUT GUIDES ================= */
var GUIDES=[
 {id:'g_avail',title:'خواندن خروجی جستجوی پرواز (AY)',icon:'🔍',type:'anatomy',
  intro:'وقتی دستور AY یا AV می‌زنید، لیست پروازها به شکل زیر نمایش داده می‌شود. روی هر بخش رنگی کلیک کنید تا بدانید چیست.',
  lines:[{parts:[
    {t:'1',k:'line'},{t:'  '},{t:'YY',k:'al'},{t:'  '},{t:'1012',k:'fn'},{t:' '},
    {t:'LA',k:'cls'},{t:' '},{t:'DA',k:'cls'},{t:' '},{t:'YA',k:'cls'},{t:'  '},
    {t:'WE',k:'day'},{t:'06JUL',k:'date'},{t:' '},{t:'KIHTHR',k:'route'},{t:' '},
    {t:'2000',k:'dep'},{t:'  '},{t:'2100',k:'arr'},{t:'  '},{t:'310  0  D',k:'extra'}
  ]}],
  glossary:{
    line:{label:'شماره خط',desc:'شماره خط پرواز در لیست نتایج. برای انتخاب همین پرواز از این شماره در دستور SD استفاده می‌کنید. مثلاً SD1Y3 یعنی خط ۱، کلاس Y، ۳ مسافر.'},
    al:{label:'کد ایرلاین',desc:'کد دو حرفی شرکت هواپیمایی. برای دیدن نام ایرلاین از کد، دستور DX:A/YY را بزنید.'},
    fn:{label:'شماره پرواز',desc:'شماره پرواز. این شماره در خروجی RT، بلیط و لیست‌های ML هم تکرار می‌شود.'},
    cls:{label:'کلاس + وضعیت ظرفیت',desc:'هر جفت‌حرف یک کلاس پروازی است. حرف اول = کلاس (Y، D، L و...)، حرف دوم = وضعیت ظرفیت. مهم‌ترین حالت‌ها: A = بیش از ۹ صندلی خالی | عدد ۱ تا ۹ = تعداد دقیق صندلی | C = ظرفیت تکمیل | X یا L = کلاس بسته/کنسل. پس YA یعنی کلاس Y با بیش از ۹ صندلی آزاد.'},
    day:{label:'روز هفته',desc:'مخفف روز هفته میلادی: MO دوشنبه، TU سه‌شنبه، WE چهارشنبه، TH پنجشنبه، FR جمعه، SA شنبه، SU یکشنبه.'},
    date:{label:'تاریخ پرواز',desc:'تاریخ به فرمت روز + ماه میلادی. مثلاً 06JUL یعنی ۶ ژوئیه.'},
    route:{label:'مسیر پرواز',desc:'کد مبدا و مقصد پشت سر هم. KIHTHR یعنی کیش به تهران. کدها را با DX:C می‌توانید ببینید.'},
    dep:{label:'ساعت حرکت',desc:'ساعت حرکت به فرمت ۲۴ ساعته. 2000 یعنی ۲۰:۰۰.'},
    arr:{label:'ساعت ورود',desc:'ساعت رسیدن به مقصد به فرمت ۲۴ ساعته.'},
    extra:{label:'اطلاعات تکمیلی',desc:'ستون‌های پایانی شامل مدت پرواز (دقیقه)، تعداد توقف (0 = بدون توقف) و کدهای تکمیلی دیگر است.'}
  }},
 {id:'g_pnr',title:'خواندن PNR (خروجی RT)',icon:'📄',type:'anatomy',
  intro:'بعد از دستور RT، ساختار PNR به شکل زیر نمایش داده می‌شود. هر خط یک بخش از رزرو است. روی هر خط کلیک کنید.',
  lines:[
    {parts:[{t:'RP/THR001',k:'rp'}]},
    {parts:[{t:' 1  VOSOGH/AMIR MR',k:'pax'}]},
    {parts:[{t:' 2  YY 1012 Y  WE06JUL KIHTHR HK1 2000 2100',k:'seg'}]},

function renderGuide(g){
  var area=document.getElementById('areaTerm');
  var h='<div class="wiz-header guide"><div class="wiz-title">'+g.icon+' '+esc(g.title)+'</div>';
  h+='<div class="wiz-desc">'+esc(g.intro||'')+'</div></div>';
  if(g.type==='anatomy'){
    h+='<div class="guide-sample">';
    g.lines.forEach(function(line){
      h+='<div class="g-line">';
      line.parts.forEach(function(p){
        if(p.k){h+='<span class="g-tok" data-k="'+p.k+'">'+esc(p.t)+'</span>';}
        else{h+='<span class="g-plain">'+esc(p.t)+'</span>';}
      });
      h+='</div>';
    });
    h+='</div><div class="g-hint">💡 روی هر بخش رنگی کلیک کنید تا توضیح آن را ببینید</div>';
    h+='<div class="g-detail" id="gDetail"><div class="g-detail-empty">یک بخش را از خروجی نمونه بالا انتخاب کنید</div></div>';
    h+='<div class="g-gloss">';
    for(var k in g.glossary){
      var it=g.glossary[k];
      h+='<div class="g-gloss-item" data-k="'+k+'"><div class="g-gloss-label">'+esc(it.label)+'</div><div class="g-gloss-desc">'+esc(it.desc)+'</div></div>';
    }
    h+='</div>';
  }else{
    g.tables.forEach(function(tb){
      h+='<div class="guide-table-wrap"><div class="g-table-title">'+esc(tb.title)+'</div>';
      h+='<table class="g-table"><thead><tr>';
      tb.head.forEach(function(x){h+='<th>'+esc(x)+'</th>';});
      h+='</tr></thead><tbody>';
      tb.rows.forEach(function(r){
        h+='<tr>';r.forEach(function(c,i){h+='<td'+(i===0?' class="mono"':'')+'>'+esc(c)+'</td>';});
        h+='</tr>';
      });
      h+='</tbody></table></div>';
    });
  }
  area.innerHTML=h;
  if(g.type==='anatomy'){
    area.querySelectorAll('.g-tok').forEach(function(t){
      t.addEventListener('click',function(){
        var k=this.getAttribute('data-k');var it=g.glossary[k];if(!it)return;
        area.querySelectorAll('.g-tok').forEach(function(x){x.classList.remove('sel');});
        this.classList.add('sel');
        document.getElementById('gDetail').innerHTML='<div class="g-detail-title">'+esc(it.label)+'</div><div class="g-detail-desc">'+esc(it.desc)+'</div>';
        area.querySelectorAll('.g-gloss-item').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-k')===k);});
      });
    });
    area.querySelectorAll('.g-gloss-item').forEach(function(x){
      x.addEventListener('click',function(){
        var k=this.getAttribute('data-k');var tok=area.querySelector('.g-tok[data-k="'+k+'"]');
        if(tok){tok.click();tok.scrollIntoView({behavior:'smooth',block:'center'});}
      });
    });
  }
  if(window.innerWidth<960){area.scrollIntoView({behavior:'smooth'});}
}
function selectGuide(id){
  for(var i=0;i<GUIDES.length;i++){if(GUIDES[i].id===id){renderGuide(GUIDES[i]);break;}}
  clearTermActive();
  var b=document.querySelector('.side-item[data-guide="'+id+'"]');
  if(b)b.classList.add('active');
}

/* ================= RENDER ENGINE ================= */
function renderField(f){
  var h='<div class="field"><label>'+esc(f.label)+'</label>';
  if(f.type==='select'){h+='<select class="inp" data-k="'+f.k+'">';(f.opts||[]).forEach(function(o){var val=(typeof o==='object')?o.v:o;var lab=(typeof o==='object')?o.l:o;h+='<option value="'+esc(val)+'">'+esc(lab)+'</option>';});h+='</select>';}
  else{h+='<input class="inp'+(f.ltr?' ltr':'')+'" data-k="'+f.k+'" type="'+(f.type||'text')+'" placeholder="'+esc(f.ph||'')+'">';}
  if(f.dateHelper){h+='<input type="date" class="inp dateHelper" data-target="'+f.k+'" style="margin-top:6px"><div class="hint">برای تولید خودکار تاریخ میلادی از انتخابگر بالا استفاده کنید.</div>';}
  if(f.hint)h+='<div class="hint">'+esc(f.hint)+'</div>';
  h+='</div>';return h;
}
function renderSpec(spec,areaEl,opts){
  opts=opts||{};var h='';
  if(!opts.noHeader){h+='<div class="spec-head"><div class="spec-title">'+spec.icon+' '+esc(spec.title)+' <span class="cmd-badge">'+esc(spec.cmdLabel)+'</span></div><div class="spec-desc">'+esc(spec.desc)+'</div>';
   if(spec.pattern)h+='<div class="pattern">الگو: <code>'+esc(spec.pattern)+'</code></div>';h+='</div>';}
  else if(spec.pattern){h+='<div class="pattern">الگو: <code>'+esc(spec.pattern)+'</code></div>';}
  h+='<div class="fields">';(spec.fields||[]).forEach(function(f){h+=renderField(f);});
  if(!spec.fields||!spec.fields.length){h+='<div class="hint" style="grid-column:1/-1">این دستور پارامتر ندارد و به صورت ثابت اجرا می‌شود.</div>';}
  h+='</div><div class="output-wrap"><div class="output-label">📟 دستور تولید شده:</div><div class="output-box"><span class="cmd-text"></span></div><div class="output-actions"><button class="btn-copy copyBtn">📋 کپی دستور</button><button class="btn-ghost clearBtn">پاک کردن</button></div></div>';
  if(spec.examples&&spec.examples.length){h+='<div class="examples"><div class="ex-label">مثال‌ها:</div><div class="ex-chips">';spec.examples.forEach(function(e){h+='<button class="chip" data-copy="'+esc(e)+'">'+esc(e)+'</button>';});h+='</div></div>';}
  if(spec.notes&&spec.notes.length){h+='<div class="notes">';spec.notes.forEach(function(n){var ic=n.t==='warn'?'⚠️':(n.t==='danger'?'🚨':'ℹ️');h+='<div class="note '+(n.t||'info')+'">'+ic+' '+esc(n.x)+'</div>';});h+='</div>';}
  areaEl.innerHTML=h;
  var outEl=areaEl.querySelector('.cmd-text');
  function update(){var v={};areaEl.querySelectorAll('.inp[data-k]').forEach(function(el){v[el.getAttribute('data-k')]=el.value;});var out='';try{out=spec.build(v);}catch(e){out='[خطا]';}outEl.textContent=out;}
  areaEl.querySelectorAll('.inp').forEach(function(el){el.addEventListener('input',update);});
  areaEl.querySelectorAll('.dateHelper').forEach(function(el){el.addEventListener('change',function(){var t=areaEl.querySelector('.inp[data-k="'+this.getAttribute('data-target')+'"]');if(t&&this.value){t.value=gregFromDateInput(this.value);update();}});});
  areaEl.querySelector('.copyBtn').addEventListener('click',function(){copyText(outEl.textContent);this.textContent='✅ کپی شد';showToast('کپی شد');var s=this;setTimeout(function(){s.textContent='📋 کپی دستور';},1500);});
  areaEl.querySelector('.clearBtn').addEventListener('click',function(){areaEl.querySelectorAll('.inp').forEach(function(el){if(el.tagName==='SELECT')el.selectedIndex=0;else el.value='';});update();});
  areaEl.querySelectorAll('.chip').forEach(function(c){c.addEventListener('click',function(){copyText(c.getAttribute('data-copy'));showToast(c.getAttribute('data-copy'));});});
  update();
}

function findSpec(data,id){for(var i=0;i<data.length;i++){for(var j=0;j<data[i].items.length;j++){if(data[i].items[j].id===id)return data[i].items[j];}}return null;}
function clearTermActive(){document.getElementById('sideTerm').querySelectorAll('.side-item').forEach(function(b){b.classList.remove('active');});}
function buildTermSidebar(){
  var c=document.getElementById('sideTerm');var h='';
  h+='<div class="side-cat"><div class="side-cat-name">🧭 راهنمای گام‌به‌گام (ویزارد)</div>';

  h+='</div><div class="side-cat"><div class="side-cat-name">📖 خواندن خروجی ترمینال</div>';
  GUIDES.forEach(function(g){h+='<button class="side-item guide" data-guide="'+g.id+'" data-search="'+esc((g.title+' '+g.intro).toLowerCase())+'"><span class="si-cmd">'+g.icon+'</span><span class="si-title">'+esc(g.title)+'</span></button>';});
  h+='</div>';

   cat.items.forEach(function(s){h+='<button class="side-item" data-id="'+s.id+'" data-search="'+esc((s.title+' '+s.cmdLabel+' '+s.desc).toLowerCase())+'"><span class="si-cmd">'+esc(s.cmdLabel)+'</span><span class="si-title">'+esc(s.title)+'</span></button>';});
   h+='</div>';});
  c.innerHTML=h;
  c.querySelectorAll('.side-item[data-wiz]').forEach(function(b){b.addEventListener('click',function(){selectWizard(b.getAttribute('data-wiz'));});});
  c.querySelectorAll('.side-item[data-guide]').forEach(function(b){b.addEventListener('click',function(){selectGuide(b.getAttribute('data-guide'));});});
  c.querySelectorAll('.side-item[data-id]').forEach(function(b){b.addEventListener('click',function(){selectItem('term',b.getAttribute('data-id'));});});
}
function selectItem(view,id){
  var data=(view==='term')?TERMINAL:API;var area=document.getElementById(view==='term'?'areaTerm':'areaApi');
  var spec=findSpec(data,id);if(!spec)return;
  if(view==='term'){clearTermActive();}
  var side=document.getElementById(view==='term'?'sideTerm':'sideApi');
  side.querySelectorAll('.side-item[data-id]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-id')===id);});
  renderSpec(spec,area);
  if(window.innerWidth<960){area.scrollIntoView({behavior:'smooth'});}
}

/* ================= WIZARD ================= */
var currentWiz=null,wizStep=0,wizMode=0;
function getWizSteps(w){if(w.modes){return w.modes[wizMode].steps.map(function(r){return mk(r);});}return w.steps;}
function selectWizard(id){for(var i=0;i<WIZARDS.length;i++){if(WIZARDS[i].id===id){currentWiz=WIZARDS[i];break;}}
 if(!currentWiz)return;wizStep=0;wizMode=0;clearTermActive();
 var b=document.querySelector('.side-item[data-wiz="'+id+'"]');if(b)b.classList.add('active');
 renderWizard();if(window.innerWidth<960){document.getElementById('areaTerm').scrollIntoView({behavior:'smooth'});}}
function renderWizard(){
  var w=currentWiz;var area=document.getElementById('areaTerm');var steps=getWizSteps(w);
  if(wizStep>=steps.length)wizStep=steps.length-1;
  var pct=Math.round(((wizStep+1)/steps.length)*100);
  var h='<div class="wiz-header"><div class="wiz-title">'+w.icon+' '+esc(w.title)+'</div><div class="wiz-desc">'+esc(w.desc)+'</div>';
  if(w.modes){h+='<div class="wiz-modes">';w.modes.forEach(function(m,idx){h+='<button class="mode-chip'+(idx===wizMode?' active':'')+'" data-mode="'+idx+'">'+esc(m.label)+'</button>';});h+='</div>';}
  h+='<div class="wiz-progress"><div class="wiz-bar"><div class="wiz-fill" style="width:'+pct+'%"></div></div><span class="wiz-step-label">مرحله '+(wizStep+1)+' از '+steps.length+'</span></div></div>';
  h+='<div class="wiz-steps-nav">';steps.forEach(function(s,idx){var cls='step-dot'+(idx===wizStep?' active':'')+(idx<wizStep?' done':'');h+='<button class="'+cls+'" data-step="'+idx+'" title="'+esc(s.t)+'">'+(idx<wizStep?'✓':(idx+1))+'</button>';});h+='</div>';
  h+='<div id="wizStepContent"></div><div class="wiz-nav"><button class="btn-nav btn-prev" id="wizPrev">→ مرحله قبل</button>';
  if(wizStep<steps.length-1){h+='<button class="btn-nav btn-next" id="wizNext">مرحله بعد ←</button>';}else{h+='<button class="btn-nav btn-next" disabled>✅ پایان مراحل</button>';}
  h+='</div>';area.innerHTML=h;renderWizStep(steps);
  area.querySelectorAll('.mode-chip').forEach(function(b){b.addEventListener('click',function(){wizMode=parseInt(this.getAttribute('data-mode'),10);wizStep=0;renderWizard();});});
  area.querySelectorAll('.step-dot').forEach(function(b){b.addEventListener('click',function(){wizStep=parseInt(this.getAttribute('data-step'),10);renderWizard();});});
  var prev=document.getElementById('wizPrev');if(prev){prev.addEventListener('click',function(){if(wizStep>0){wizStep--;renderWizard();}});}
  var next=document.getElementById('wizNext');if(next){next.addEventListener('click',function(){if(wizStep<steps.length-1){wizStep++;renderWizard();}});}
}
function renderWizStep(steps){
  var step=steps[wizStep];var el=document.getElementById('wizStepContent');
  var h='<div class="wiz-step-card"><div class="wiz-step-num">'+(wizStep+1)+'</div><div class="wiz-step-body"><div class="wiz-step-title">'+esc(step.t)+'</div><div class="wiz-step-desc">'+esc(step.d||'')+'</div><div class="wiz-spec-area"></div></div></div>';
  el.innerHTML=h;var specArea=el.querySelector('.wiz-spec-area');
  if(step.custom==='docs'){renderDocsBuilder(specArea);}
  else if(step.custom==='ssrextra'){renderSsrExtraBuilder(specArea);}
  else if(step.ref){var sp=findSpec(TERMINAL,step.ref);if(sp)renderSpec(sp,specArea,{noHeader:true});}
}

  document.getElementById('viewTerm').classList.toggle('active',view==='term');

}
