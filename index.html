<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nira Command Builder | سازنده دستورات نیرا</title>
<style>
:root{
  --bg:#0f172a;--panel:#1e293b;--card:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --accent:#0d9488;--accent-d:#0f766e;--accent-l:#ccfbf1;
  --blue:#2563eb;--blue-l:#dbeafe;
  --orange:#d97706;--orange-l:#fef3c7;
  --red:#dc2626;--red-l:#fee2e2;
  --green:#059669;--green-l:#d1fae5;
  --purple:#7c3aed;--purple-l:#ede9fe;
  --code:#0f172a;--code-t:#5eead4;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:var(--text);line-height:1.7;font-size:14px}
::selection{background:var(--accent);color:#fff}

.header{background:linear-gradient(120deg,#0f172a 0%,#134e4a 55%,#0d9488 100%);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 4px 18px rgba(13,148,136,.35)}
.header-inner{max-width:1440px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:44px;height:44px;background:rgba(255,255,255,.14);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.brand h1{font-size:17px;font-weight:700}
.brand p{font-size:11px;opacity:.75;margin-top:2px}
.tabs{display:flex;gap:8px;background:rgba(255,255,255,.1);padding:5px;border-radius:12px}
.tab-btn{border:none;background:transparent;color:#cbd5e1;padding:9px 18px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:.2s;display:flex;align-items:center;gap:7px}
.tab-btn.active{background:#fff;color:var(--accent-d);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tab-btn:hover:not(.active){color:#fff}

.container{max-width:1440px;margin:0 auto;padding:20px;min-height:calc(100vh - 76px)}
.view{display:none;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.view.active{display:grid}
@media(max-width:960px){.view.active{grid-template-columns:1fr}}

.sidebar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:sticky;top:86px;max-height:calc(100vh - 106px);display:flex;flex-direction:column}
@media(max-width:960px){.sidebar{position:static;max-height:none}}
.side-search{margin:12px;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:12px;width:calc(100% - 24px)}
.side-search:focus{outline:none;border-color:var(--accent)}
.side-scroll{overflow-y:auto;padding:0 8px 12px}
.side-cat-name{padding:12px 12px 5px;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.3px}
.side-item{width:100%;text-align:right;border:none;background:none;cursor:pointer;font-family:inherit;padding:8px 10px;border-radius:9px;display:flex;align-items:center;gap:10px;transition:.15s;border-right:3px solid transparent;margin-bottom:2px}
.side-item:hover{background:#f1f5f9}
.side-item.active{background:var(--accent-l);border-right-color:var(--accent)}
.si-cmd{font-family:'Consolas',monospace;font-size:11px;font-weight:700;color:var(--accent-d);background:var(--accent-l);padding:2px 8px;border-radius:6px;direction:ltr;min-width:44px;text-align:center;flex-shrink:0}
.side-item.active .si-cmd{background:var(--accent);color:#fff}
.si-title{font-size:12px;color:var(--text-2);font-weight:600}
.side-item.active .si-title{color:var(--accent-d)}
.side-item.wiz .si-cmd{background:var(--purple-l);color:var(--purple)}
.side-item.wiz.active .si-cmd{background:var(--purple);color:#fff}
.side-item.wiz.active{background:var(--purple-l);border-right-color:var(--purple)}

.content{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;min-width:0}
.spec-head{padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:20px}
.spec-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cmd-badge{font-family:'Consolas',monospace;font-size:13px;background:var(--code);color:var(--code-t);padding:3px 12px;border-radius:8px;direction:ltr}
.spec-desc{font-size:13px;color:var(--text-2);margin-top:8px}
.pattern{margin-top:10px;font-size:12px;color:var(--text-2);background:#f8fafc;border:1px dashed var(--border);padding:8px 12px;border-radius:8px}
.pattern code{font-family:'Consolas',monospace;direction:ltr;display:inline-block;color:var(--accent-d);font-weight:700}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--text-2)}
.req{color:var(--red)}
.inp{padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;background:#fff;color:var(--text);width:100%;transition:.2s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.inp.ltr{direction:ltr;text-align:left;font-family:'Consolas',monospace}
.hint{font-size:11px;color:var(--text-3);line-height:1.6}

.output-wrap{margin-top:24px;background:var(--code);border-radius:14px;padding:20px;position:relative;overflow:hidden}
.output-wrap::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,#0d9488,#5eead4)}
.output-label{color:#94a3b8;font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.output-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px;min-height:56px;display:flex;align-items:center}
.cmd-text{font-family:'Consolas','Courier New',monospace;font-size:16px;color:var(--code-t);direction:ltr;text-align:left;word-break:break-all;width:100%;line-height:1.8;font-weight:600}
.cmd-multi{white-space:pre-wrap;font-size:13px}
.output-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn-copy{background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:.2s;display:flex;align-items:center;gap:7px}
.btn-copy:hover{background:var(--accent-d)}
.btn-ghost{background:transparent;color:#94a3b8;border:1.5px solid rgba(255,255,255,.2);padding:10px 18px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;transition:.2s}
.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,.4)}

.examples{margin-top:22px}
.ex-label{font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:10px}
.ex-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:'Consolas',monospace;font-size:12px;direction:ltr;background:#f1f5f9;border:1.5px solid var(--border);color:var(--text);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.2s}
.chip:hover{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d)}

.notes{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.note{border-radius:10px;padding:12px 15px;font-size:12px;line-height:1.8}
.note.info{background:var(--blue-l);border-right:3px solid var(--blue);color:#1e3a8a}
.note.warn{background:var(--orange-l);border-right:3px solid var(--orange);color:#78350f}
.note.danger{background:var(--red-l);border-right:3px solid var(--red);color:#7f1d1d}
.note.success{background:var(--green-l);border-right:3px solid var(--green);color:#064e3b}

/* ===== WIZARD ===== */
.wiz-header{background:linear-gradient(120deg,#4c1d95,#7c3aed);color:#fff;border-radius:14px;padding:20px;margin-bottom:20px}
.wiz-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.wiz-desc{font-size:13px;opacity:.85;margin-top:6px}
.wiz-modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mode-chip{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:12px;transition:.2s}
.mode-chip:hover{background:rgba(255,255,255,.15)}
.mode-chip.active{background:#fff;color:var(--purple);font-weight:700;border-color:#fff}
.wiz-progress{display:flex;align-items:center;gap:12px;margin-top:16px}
.wiz-bar{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.wiz-fill{height:100%;background:#5eead4;border-radius:6px;transition:width .3s}
.wiz-step-label{font-size:12px;font-weight:700;white-space:nowrap}
.wiz-steps-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.step-dot{border:1.5px solid var(--border);background:#fff;color:var(--text-2);width:auto;min-width:34px;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;transition:.2s}
.step-dot:hover{border-color:var(--purple);color:var(--purple)}
.step-dot.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.step-dot.done{background:var(--green-l);color:var(--green);border-color:var(--green)}
.wiz-step-card{display:flex;gap:16px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px}
.wiz-step-num{width:44px;height:44px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.wiz-step-body{flex:1;min-width:0}
.wiz-step-title{font-size:16px;font-weight:700;margin-bottom:4px}
.wiz-step-desc{font-size:13px;color:var(--text-2);margin-bottom:16px}
.wiz-spec-area{margin-top:4px}
.wiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.btn-nav{padding:11px 26px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:.2s;border:none;display:flex;align-items:center;gap:8px}
.btn-prev{background:#fff;border:1.5px solid var(--border);color:var(--text-2)}
.btn-prev:hover{border-color:var(--purple);color:var(--purple)}
.btn-next{background:var(--purple);color:#fff}
.btn-next:hover{background:#6d28d9}
.btn-next:disabled{background:#cbd5e1;cursor:not-allowed}
.pax-card{border:1.5px dashed var(--border);border-radius:12px;padding:16px;margin-top:14px;position:relative}
.pax-card-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--code);color:#5eead4;padding:12px 26px;border-radius:12px;font-size:13px;font-family:'Consolas',monospace;direction:ltr;transition:transform .3s;z-index:999;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
@media(max-width:600px){.fields{grid-template-columns:1fr}.content{padding:18px}.wiz-step-card{flex-direction:column}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">✈️</div>
      <div>
        <h1>Nira Command Builder</h1>
        <p>سازنده دستورات ترمینال و وب‌سرویس سامانه رزرواسیون نیرا</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabTerm" onclick="switchView('term')">⌨️ ترمینال نیرا</button>
      <button class="tab-btn" id="tabApi" onclick="switchView('api')">📡 وب‌سرویس (API)</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="view active" id="viewTerm">
    <aside class="sidebar">
      <input class="side-search" id="searchTerm" placeholder="🔍 جستجو...">
      <div class="side-scroll" id="sideTerm"></div>
    </aside>
    <main class="content" id="areaTerm"></main>
  </div>
  <div class="view" id="viewApi">
    <aside class="sidebar">
      <input class="side-search" id="searchApi" placeholder="🔍 جستجوی متد...">
      <div class="side-scroll" id="sideApi"></div>
    </aside>
    <main class="content" id="areaApi"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
var GREG_MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function P(v,d){return (v&&String(v).trim())?String(v).trim():d;}
function gregFromDateInput(v){if(!v)return'';var p=v.split('-');var d=parseInt(p[2],10);var m=GREG_MONTHS[parseInt(p[1],10)-1];return (d<10?'0':'')+d+m;}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){fallbackCopy(t);});}else{fallbackCopy(t);}}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function showToast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1800);}
function outputBlock(outId,copyId,multi){
  var h='<div class="output-wrap" style="margin-top:16px"><div class="output-label">📟 دستور تولید شده:</div>';
  if(multi){h+='<div class="output-box"><pre class="cmd-text cmd-multi" id="'+outId+'"></pre></div>';}
  else{h+='<div class="output-box"><span class="cmd-text" id="'+outId+'"></span></div>';}
  h+='<div class="output-actions"><button class="btn-copy" id="'+copyId+'">📋 کپی</button></div></div>';
  return h;
}
function wireCopy(copyId,outId){
  document.getElementById(copyId).addEventListener('click',function(){
    copyText(document.getElementById(outId).textContent);showToast('کپی شد');
    var s=this;s.textContent='✅ کپی شد';setTimeout(function(){s.textContent='📋 کپی';},1500);
  });
}

/* ---------- AIRLINE BASE URLS ---------- */
var WS1={EP:'https://restapi.iaa.ir/ws1',FP:'https://api.flypersiaairlines.ir/ws1',HH:'https://api.taban.aero/ws1',IV:'https://api.caspianairlines.com/ws1',I3:'https://api.ataair.ir/ws1',IRZ:'https://api.sahaair.com/ws1',J1:'https://apps.merajairlines.ir/ws1',NV:'https://api.karunair.ir/ws1',PA:'https://api.parsair.ir/ws1',PY:'https://api.pouyaair.com/ws1',QB:'https://api.qeshm-air.com/ws1',VR:'https://api.vareshair.ir/ws1',Y9:'https://api.kishairlines.ir/ws1',ZV:'https://api.zagrosairlines.com/ws1',A1:'http://a1.nirasoft.ir/ws1',DZD:'https://api.yazdairways.com/ws1',IRU:'https://api.chabaharairlines.ir/ws1',A7:'https://api.asajet.ir/ws1',RAI:'https://api.raimonairways.com/ws1',ATS:'https://api.atlasairplus.com/ws1',TKN:'https://api.flykishiran.com/ws1',NSN:'https://api.nasimairlines.ir/ws1',ISP:'https://nrs.jskyair.com/ws1',MEH:'https://api.mehrairways.com/ws1',MBL:'https://nrs.ladairways.ir/ws1',SHR:'https://nrs.soroushair.com/ws1'};
var WS2={EP:'https://restapi.iaa.ir/ws2/cgi-bin/NRSWeb.cgi',FP:'https://api.flypersiaairlines.ir/ws2/cgi-bin/NRSWEB.cgi',HH:'https://api.taban.aero/ws2/cgi-bin/NRSWebWS.cgi',IV:'https://api.caspianairlines.com/ws2/cgi-bin/NRSWeb.cgi',I3:'https://api.ataair.ir/ws2/cgi-bin/NRSWeb.cgi',IRZ:'https://api.sahaair.com/ws2/cgi-bin/NRSWeb.cgi',J1:'https://apps.merajairlines.ir/ws2/cgi-bin/NRSWeb.cgi',NV:'https://api.karunair.ir/ws2/cgi-bin/NRSWEB.cgi',PA:'https://api.parsair.ir/ws2/cgi-bin/NRSWeb.cgi',PY:'https://api.pouyaair.com/ws2/cgi-bin/NRSWEB.cgi',QB:'https://api.qeshm-air.com/ws2/cgi-bin/NRSWeb.cgi',VR:'https://api.vareshair.ir/ws2/cgi-bin/NRSWebWS.cgi',Y9:'https://api.kishairlines.ir/ws2/cgi-bin/NRSWEB.cgi',ZV:'https://api.zagrosairlines.com/ws2/cgi-bin/NRSWeb.cgi',A1:'http://a1.nirasoft.ir/ws2/cgi-bin/NRSWeb.cgi',DZD:'https://api.yazdairways.com/ws2/cgi-bin/NRSWeb.cgi',IRU:'https://api.chabaharairlines.ir/ws2/cgi-bin/NRSWeb.cgi',A7:'https://api.asajet.ir/ws2/cgi-bin/NRSWeb.cgi',RAI:'https://api.raimonairways.com/ws2/cgi-bin/NRSWeb.cgi',ATS:'https://api.atlasairplus.com/ws2/cgi-bin/NRSWeb.cgi',TKN:'https://api.flykishiran.com/ws2/cgi-bin/NRSWeb.cgi',NSN:'https://api.nasimairlines.ir/ws2/cgi-bin/NRSWeb.cgi',ISP:'https://nrs.jskyair.com/ws2/cgi-bin/NRSWeb.cgi',MEH:'https://api.mehrairways.com/ws2/cgi-bin',LMB:'https://nrs.ladairways.ir/ws2/cgi-bin/NRSWeb.cgi',SHR:'https://nrs.soroushair.com/ws2/cgi-bin/NRSWeb.cgi'};

/* ============================================================
   TERMINAL COMMANDS DATA
============================================================ */
var TERMINAL=[
{name:'جستجو و دسترسی',icon:'🔍',items:[
 {id:'ay',title:'Availability پرواز',cmdLabel:'AY / AV',icon:'🔍',desc:'مشاهده ظرفیت و کلاس‌های پرواز در یک مسیر و تاریخ مشخص.',pattern:'AY{مبدا}{مقصد}/{تاریخ}',
  fields:[
   {k:'cmd',label:'نوع دستور',type:'select',opts:['AY','AV'],hint:'AY فقط ایرلاین سایِن‌شده، AV چند ایرلاین'},
   {k:'src',label:'کد شهر مبدا',ph:'KIH',ltr:true},
   {k:'dst',label:'کد شهر مقصد',ph:'THR',ltr:true},
   {k:'date',label:'تاریخ',ph:'28AUG یا 07SHA یا . یا +',ltr:true,dateHelper:true,hint:'میلادی: 28AUG | شمسی: 07SHA | نسبی: . امروز، + فردا، - دیروز'}
  ],
  build:function(v){return P(v.cmd,'AY')+P(v.src,'[مبدا]')+P(v.dst,'[مقصد]')+'/'+P(v.date,'[تاریخ]');},
  examples:['AYKIHTHR/28AUG','AYKIHTHR/07SHA','AYKIHTHR/.','AYKIHTHR/+','AVKIHTHR/28AUG','AY:RA2'],
  notes:[{t:'info',x:'AY فقط پروازهای ایرلاین سایِن‌شده، AV پروازهای چند ایرلاین را نشان می‌دهد.'},{t:'info',x:'برای پرواز رفت‌وبرگشت از AY:RA{n} استفاده کنید.'}]},
 {id:'sk',title:'برنامه پروازی مسیر',cmdLabel:'SK',icon:'📅',desc:'مشاهده برنامه پروازی یک ایرلاین در مسیر مشخص.',pattern:'SK:{مبدا}{مقصد}/{تاریخ}',
  fields:[{k:'src',label:'مبدا',ph:'THR',ltr:true},{k:'dst',label:'مقصد',ph:'KIH',ltr:true},{k:'date',label:'تاریخ',ph:'05SHA',ltr:true,dateHelper:true}],
  build:function(v){return 'SK:'+P(v.src,'[مبدا]')+P(v.dst,'[مقصد]')+'/'+P(v.date,'[تاریخ]');},examples:['SK:THRKIH/05SHA'],notes:[]},
 {id:'scall',title:'تمام پروازها از مبدا و مقصد',cmdLabel:'SCALL',icon:'📅',desc:'مشاهده تمامی پروازها از هر مبدا و مقصد در یک تاریخ.',pattern:'SCALL/{تاریخ}',
  fields:[{k:'date',label:'تاریخ',ph:'17AUG',ltr:true,dateHelper:true}],
  build:function(v){return 'SCALL/'+P(v.date,'[تاریخ]');},examples:['SCALL/17AUG'],notes:[]},
 {id:'mlr',title:'لیست مسافران خط پرواز',cmdLabel:'ML/R',icon:'👥',desc:'مشاهده لیست مسافران یک خط پرواز از نتیجه Availability.',pattern:'ML/R{شماره خط}',
  fields:[{k:'line',label:'شماره خط',ph:'1',ltr:true}],build:function(v){return 'ML/R'+P(v.line,'[خط]');},examples:['ML/R1'],notes:[]},
 {id:'tcc',title:'اختلاف ساعت کشورها',cmdLabel:'TCC',icon:'🕐',desc:'اختلاف ساعت بین دو نقطه (پرواز خارجی).',pattern:'TCC:{مبدا}{مقصد}',
  fields:[{k:'src',label:'مبدا',ph:'IST',ltr:true},{k:'dst',label:'مقصد',ph:'THR',ltr:true}],build:function(v){return 'TCC:'+P(v.src,'[مبدا]')+P(v.dst,'[مقصد]');},examples:['TCC:ISTTHR'],notes:[]}

function renderField(f){
  var h='<div class="field"><label>'+esc(f.label)+(f.req?' <span class="req">*</span>':'')+'</label>';
  if(f.type==='select'){
    h+='<select class="inp" data-k="'+f.k+'">';
    (f.opts||[]).forEach(function(o){
      var val=(typeof o==='object')?o.v:o;
      var lab=(typeof o==='object')?o.l:o;
      h+='<option value="'+esc(val)+'">'+esc(lab)+'</option>';
    });
    h+='</select>';
  }else{
    h+='<input class="inp'+(f.ltr?' ltr':'')+'" data-k="'+f.k+'" type="'+(f.type||'text')+'" placeholder="'+esc(f.ph||'')+'">';
  }
  if(f.dateHelper){
    h+='<input type="date" class="inp dateHelper" data-target="'+f.k+'" style="margin-top:6px">';
    h+='<div class="hint">برای تولید خودکار تاریخ میلادی (مثل 28AUG) از انتخابگر بالا استفاده کنید؛ یا مقدار شمسی/نسبی را دستی تایپ کنید.</div>';
  }
  if(f.hint)h+='<div class="hint">'+esc(f.hint)+'</div>';
  h+='</div>';
  return h;
}

function renderSpec(spec,areaEl,opts){
  opts=opts||{};
  var h='';
  if(!opts.noHeader){
    h+='<div class="spec-head">';
    h+='<div class="spec-title">'+spec.icon+' '+esc(spec.title)+' <span class="cmd-badge">'+esc(spec.cmdLabel)+'</span></div>';
    h+='<div class="spec-desc">'+esc(spec.desc)+'</div>';
    if(spec.pattern)h+='<div class="pattern">الگو: <code>'+esc(spec.pattern)+'</code></div>';
    h+='</div>';
  } else if(spec.pattern){
    h+='<div class="pattern">الگو: <code>'+esc(spec.pattern)+'</code></div>';
  }
  h+='<div class="fields">';
  (spec.fields||[]).forEach(function(f){h+=renderField(f);});
  if(!spec.fields||!spec.fields.length){h+='<div class="hint" style="grid-column:1/-1">این دستور پارامتر ندارد و به صورت ثابت اجرا می‌شود.</div>';}
  h+='</div>';
  h+='<div class="output-wrap"><div class="output-label">📟 دستور تولید شده:</div>';
  h+='<div class="output-box"><span class="cmd-text"></span></div>';
  h+='<div class="output-actions"><button class="btn-copy copyBtn">📋 کپی دستور</button><button class="btn-ghost clearBtn">پاک کردن</button></div></div>';
  if(spec.examples&&spec.examples.length){
    h+='<div class="examples"><div class="ex-label">مثال‌ها (برای کپی کلیک کنید):</div><div class="ex-chips">';
    spec.examples.forEach(function(e){h+='<button class="chip" data-copy="'+esc(e)+'">'+esc(e)+'</button>';});
    h+='</div></div>';
  }
  if(spec.notes&&spec.notes.length){
    h+='<div class="notes">';
    spec.notes.forEach(function(n){var ic=n.t==='warn'?'⚠️':(n.t==='danger'?'🚨':(n.t==='success'?'✅':'ℹ️'));h+='<div class="note '+(n.t||'info')+'">'+ic+' '+esc(n.x)+'</div>';});
    h+='</div>';
  }
  areaEl.innerHTML=h;
  var outEl=areaEl.querySelector('.cmd-text');
  function update(){
    var v={};
    areaEl.querySelectorAll('.inp[data-k]').forEach(function(el){v[el.getAttribute('data-k')]=el.value;});
    var out='';
    try{out=spec.build(v);}catch(e){out='[خطا در ساخت دستور]';}
    outEl.textContent=out;
  }
  areaEl.querySelectorAll('.inp').forEach(function(el){el.addEventListener('input',update);});
  areaEl.querySelectorAll('.dateHelper').forEach(function(el){
    el.addEventListener('change',function(){
      var t=areaEl.querySelector('.inp[data-k="'+this.getAttribute('data-target')+'"]');
      if(t&&this.value){t.value=gregFromDateInput(this.value);update();}
    });
  });
  areaEl.querySelector('.copyBtn').addEventListener('click',function(){
    copyText(outEl.textContent);this.textContent='✅ کپی شد';showToast('کپی شد');
    var self=this;setTimeout(function(){self.textContent='📋 کپی دستور';},1500);
  });
  areaEl.querySelector('.clearBtn').addEventListener('click',function(){
    areaEl.querySelectorAll('.inp').forEach(function(el){if(el.tagName==='SELECT')el.selectedIndex=0;else el.value='';});
    update();
  });
  areaEl.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click',function(){copyText(c.getAttribute('data-copy'));showToast(c.getAttribute('data-copy'));});
  });
  update();
}

function selectItem(view,id){
  var data=(view==='term')?TERMINAL:API;
  var area=document.getElementById(view==='term'?'areaTerm':'areaApi');
  var spec=findSpec(data,id);
  if(!spec)return;
  if(view==='term'){clearTermActive();}
  var side=document.getElementById(view==='term'?'sideTerm':'sideApi');

}

/* ---------- Wizard selection & rendering ---------- */
var currentWiz=null,wizStep=0,wizMode=0;
function getWizSteps(w){
  if(w.modes){
    return w.modes[wizMode].steps.map(function(r){return mk(r);});
  }
  return w.steps;
}
function selectWizard(id){
  for(var i=0;i<WIZARDS.length;i++){
    if(WIZARDS[i].id===id){currentWiz=WIZARDS[i];break;}
  }
  if(!currentWiz)return;
  wizStep=0;wizMode=0;
  clearTermActive();
  var b=document.querySelector('.side-item[data-wiz="'+id+'"]');
  if(b)b.classList.add('active');
  renderWizard();
  if(window.innerWidth<960){document.getElementById('areaTerm').scrollIntoView({behavior:'smooth'});}
}
function renderWizard(){
  var w=currentWiz;
  var area=document.getElementById('areaTerm');
  var steps=getWizSteps(w);
  if(wizStep>=steps.length)wizStep=steps.length-1;
  var pct=Math.round(((wizStep+1)/steps.length)*100);
  var h='<div class="wiz-header">';
  h+='<div class="wiz-title">'+w.icon+' '+esc(w.title)+'</div>';
  h+='<div class="wiz-desc">'+esc(w.desc)+'</div>';
  if(w.modes){
    h+='<div class="wiz-modes">';
    w.modes.forEach(function(m,idx){
      h+='<button class="mode-chip'+(idx===wizMode?' active':'')+'" data-mode="'+idx+'">'+esc(m.label)+'</button>';
    });
    h+='</div>';
  }
  h+='<div class="wiz-progress"><div class="wiz-bar"><div class="wiz-fill" style="width:'+pct+'%"></div></div><span class="wiz-step-label">مرحله '+ (wizStep+1) +' از '+ steps.length +'</span></div>';
  h+='</div>';
  h+='<div class="wiz-steps-nav">';
  steps.forEach(function(s,idx){
    var cls='step-dot'+(idx===wizStep?' active':'')+(idx<wizStep?' done':'');
    h+='<button class="'+cls+'" data-step="'+idx+'" title="'+esc(s.t)+'">'+(idx<wizStep?'✓':(idx+1))+'</button>';
  });
  h+='</div>';
  h+='<div id="wizStepContent"></div>';
  h+='<div class="wiz-nav">';
  h+='<button class="btn-nav btn-prev" id="wizPrev">→ مرحله قبل</button>';
  if(wizStep<steps.length-1){h+='<button class="btn-nav btn-next" id="wizNext">مرحله بعد ←</button>';}
  else{h+='<button class="btn-nav btn-next" disabled>✅ پایان مراحل</button>';}
  h+='</div>';
  area.innerHTML=h;
  renderWizStep(steps);
  area.querySelectorAll('.mode-chip').forEach(function(b){
    b.addEventListener('click',function(){wizMode=parseInt(this.getAttribute('data-mode'),10);wizStep=0;renderWizard();});
  });
  area.querySelectorAll('.step-dot').forEach(function(b){
    b.addEventListener('click',function(){wizStep=parseInt(this.getAttribute('data-step'),10);renderWizard();});
  });
  var prev=document.getElementById('wizPrev');
  if(prev){prev.addEventListener('click',function(){if(wizStep>0){wizStep--;renderWizard();}});}
  var next=document.getElementById('wizNext');
  if(next){next.addEventListener('click',function(){if(wizStep<steps.length-1){wizStep++;renderWizard();}});}
}
function renderWizStep(steps){
  var step=steps[wizStep];
  var el=document.getElementById('wizStepContent');
  var h='<div class="wiz-step-card">';
  h+='<div class="wiz-step-num">'+(wizStep+1)+'</div>';
  h+='<div class="wiz-step-body">';
  h+='<div class="wiz-step-title">'+esc(step.t)+'</div>';
  h+='<div class="wiz-step-desc">'+esc(step.d||'')+'</div>';
  h+='<div class="wiz-spec-area"></div>';
  h+='</div></div>';
  el.innerHTML=h;
  var specArea=el.querySelector('.wiz-spec-area');
  if(step.custom==='docs'){renderDocsBuilder(specArea);}
  else if(step.custom==='ssrextra'){renderSsrExtraBuilder(specArea);}
  else if(step.spec){renderSpec(step.spec,specArea,{noHeader:true});}
  else if(step.ref){
    var sp=findSpec(TERMINAL,step.ref);
    if(sp)renderSpec(sp,specArea,{noHeader:true});
  }
}

/* ---------- View & search ---------- */
function switchView(view){
  document.getElementById('viewTerm').classList.toggle('active',view==='term');
  document.getElementById('viewApi').classList.toggle('active',view==='api');
  document.getElementById('tabTerm').classList.toggle('active',view==='term');
  document.getElementById('tabApi').classList.toggle('active',view==='api');
}
function filterSide(view,q){
  q=q.trim().toLowerCase();
  var side=document.getElementById(view==='term'?'sideTerm':'sideApi');
  side.querySelectorAll('.side-item').forEach(function(b){
    var s=b.getAttribute('data-search')||'';
    b.style.display=(!q||s.indexOf(q)>=0)?'flex':'none';
  });
  side.querySelectorAll('.side-cat').forEach(function(cat){
    var any=false;
    cat.querySelectorAll('.side-item').forEach(function(b){if(b.style.display!=='none')any=true;});
    cat.style.display=any?'block':'none';
  });
}
